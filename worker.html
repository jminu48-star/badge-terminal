<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작업자 서명 — WorkerBadge</title>
<style>
/* 휴대폰 MetaMask 앱 안에서 열리는 페이지: 장비의 일회용 문장에 서명 → 응답 QR 을 장비 카메라에 보여 준다 */
:root{--bg:#F3F4F6;--panel:#FFFFFF;--ink:#1B222C;--muted:#5F6B7A;--line:#DDE1E7;--amber:#F2A900;--amber-ink:#3A2A00;--steel:#1F6F8B;
  --ok:#1E7B4C;--ok-bg:#E3F4EA;--no:#B8382C;--no-bg:#FBE8E6;--off:#8A93A0;--off-bg:#EEF0F3;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;--sans:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#12161C;--panel:#1A2029;--ink:#E6E9EE;--muted:#9AA4B2;--line:#2C3440;--amber:#F2B624;--amber-ink:#2A1F00;--steel:#6FB3CC;
  --ok:#6FD39E;--ok-bg:#16301F;--no:#F08A7E;--no-bg:#3A1C19;--off:#7D8695;--off-bg:#232A34;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
header{padding:12px 16px;background:#1B222C;color:#fff;font-weight:700}
main{padding:14px 16px 40px;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h2{font-size:15px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:12px 14px;font:inherit;font-weight:700;background:var(--amber);color:var(--amber-ink);cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.5}
.btn:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-all;white-space:pre-line}
.qr{background:#fff;border-radius:12px;padding:8px;margin:8px 0}
.qr svg{width:100%;height:auto;display:block}
.resp{border:2px solid var(--ok)}
.item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.item:last-child{border-bottom:0}
.chip{font-size:12px;padding:1px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-bg)} .chip.no{color:var(--no);background:var(--no-bg)} .chip.off{color:var(--off);background:var(--off-bg)}
.warn{font-size:13px;background:var(--no-bg);color:var(--no);border-radius:8px;padding:8px 10px}
</style>
</head>
<body>
<header>👷 WorkerBadge 작업자 서명</header>
<main>
  <section class="card" id="req"></section>
  <section class="card resp" id="resp" hidden></section>
  <section class="card" id="mine" hidden><h2>내 자격 (블록체인 조회)</h2><p class="mono" id="addr"></p><div id="badges"></div></section>
  <p class="mono" style="text-align:center">개인 키는 MetaMask 안에만 있고, 이 페이지는 서명 결과만 받아요.</p>
</main>
<script src="vendor/ethers.umd.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="config.js"></script>
<script>
const C = window.WB_CONFIG, $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const q = new URLSearchParams(location.search);
const eqId = q.get("eq"), nonce = q.get("n"), exp = Number(q.get("x") || 0);
const EQ = C.equipment.find((e) => e.id === eqId);
let account = null, timer = null;

function render() {
  if (!EQ || !/^[0-9a-f]{32}$/.test(nonce || "")) {
    $("req").innerHTML = `<h2>장비 QR을 찍어 주세요</h2><p class="sub">장비 화면의 QR을 휴대폰 카메라로 찍으면 이 페이지가 열려요.</p>`;
    return;
  }
  const msg = window.WB_MESSAGE(EQ.id, nonce);
  const left = exp ? Math.floor(exp - Date.now() / 1000) : null;
  if (!window.ethereum) {
    const deep = location.protocol === "https:" ? `https://metamask.app.link/dapp/${location.href.replace(/^https:\/\//, "")}` : null;
    $("req").innerHTML = `<h2>🚜 ${esc(EQ.name)} 시동 인증</h2>
      <p class="sub">서명하려면 <b>MetaMask 앱</b> 안에서 이 페이지를 열어야 해요.</p>
      ${deep ? `<a class="btn" href="${esc(deep)}">MetaMask 앱에서 열기</a>` : `<p class="warn">MetaMask 앱의 브라우저에서 이 주소를 열어 주세요.</p>`}`;
    return;
  }
  $("req").innerHTML = `<h2>🚜 ${esc(EQ.name)} 시동 인증</h2>
    <p class="sub">아래 문장에 서명하면 장비가 블록체인에서 내 자격을 확인해요.${left !== null ? ` 남은 시간 <b id="left">${Math.max(0, left)}</b>초` : ""}</p>
    <p class="mono" style="background:var(--bg);border-radius:8px;padding:8px">${esc(msg)}</p>
    <button class="btn" id="sign">MetaMask로 서명하기</button>`;
  $("sign").onclick = () => sign(msg);
}

async function sign(msg) {
  const b = $("sign"); b.disabled = true; b.textContent = "MetaMask에서 확인을 눌러 주세요…";
  try {
    const accs = await window.ethereum.request({ method: "eth_requestAccounts" });
    account = ethers.getAddress(accs[0]);
    const hex = ethers.hexlify(ethers.toUtf8Bytes(msg));
    const sig = await window.ethereum.request({ method: "personal_sign", params: [hex, account] });
    if (ethers.verifyMessage(msg, sig) !== account) throw new Error("서명이 계정과 맞지 않아요");
    const code = `WB1|${EQ.id}|${nonce}|${sig}`;
    const qr = qrcode(0, "L"); qr.addData(code); qr.make();
    $("resp").hidden = false;
    $("resp").innerHTML = `<h2>③ 이 화면을 장비 카메라에 보여 주세요</h2>
      <div class="qr" role="img" aria-label="응답 QR 코드">${qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true })}</div>
      <p class="sub" style="margin:0">서명한 계정 ${account.slice(0, 6)}…${account.slice(-4)} · 이 QR은 한 번만 쓸 수 있어요</p>
      <button class="btn ghost" id="copy" style="margin-top:8px">응답 코드 복사 (카메라가 없을 때)</button>`;
    $("copy").onclick = async () => { try { await navigator.clipboard.writeText(code); $("copy").textContent = "복사했어요"; } catch { prompt("응답 코드", code); } };
    b.textContent = "서명 완료"; $("resp").scrollIntoView({ behavior: "smooth" });
    loadMine();
  } catch (e) {
    b.disabled = false; b.textContent = "다시 서명하기";
    const p = document.createElement("p"); p.className = "warn"; p.textContent = e.code === 4001 ? "서명을 취소했어요." : e.message; $("req").appendChild(p);
  }
}

async function loadMine() {
  if (!account) return;
  $("mine").hidden = false; $("addr").textContent = account; $("badges").innerHTML = '<p class="sub">블록체인 조회 중…</p>';
  try {
    const { provider } = await window.WB_PROVIDER();
    const c = new ethers.Contract(C.contract, window.WB_ABI, provider);
    const rows = [];
    for (let t = 0; t < window.WB_TYPES.length; t++) {
      const id = Number(await c.badgeOf(account, t));
      if (!id) { rows.push(`<div class="item"><span>${window.WB_TYPES[t]}</span><span class="chip off">없음</span></div>`); continue; }
      const b = await c.badges(id), ok = await c.hasValidBadge(account, t);
      const [cls, txt] = b.revoked ? ["no", "정지"] : ok ? ["ok", "유효"] : ["off", "만료"];
      rows.push(`<div class="item"><span>${window.WB_TYPES[t]} <span class="mono">#${id}</span></span><span class="chip ${cls}">${txt}</span></div>`);
    }
    $("badges").innerHTML = rows.join("");
  } catch (e) { $("badges").innerHTML = `<p class="warn">${esc(e.message)}</p>`; }
}

render();
if (exp) timer = setInterval(() => { const el = $("left"); if (el) el.textContent = Math.max(0, Math.floor(exp - Date.now() / 1000)); }, 1000);
</script>
</body>
</html>
